# Single configuration map of the whole system.
# Precedence: case-class defaults < this file < CLI flags.
# Alternative file can be selected with: XRAY_CONFIG=conf/other.conf

paths {
  artifacts = "ml/artifacts"
}

vectorization {
  image-size = 128
  resize-mode = "fit"
  image-extensions = ["jpg", "jpeg", "png"]
}

producer {
  source = "data/chest_xray"
  batch-size = 10000
  interval-ms = 0
  local-threads = 2
  files-open-cost-bytes = 65536
  train-dest = "data/incoming"
  infer-dest = "data/incoming-infer"
}

consumer {
  trigger-seconds = 1
  max-files-per-trigger = 256
  predict-batch-size = 64
  model-path = ${paths.artifacts}"/models/saved_model"
  delete-processed-files = true
  local-threads = 8
  train {
    incoming   = "data/incoming"
    output     = "output/features-stream.parquet"
    checkpoint = "output/checkpoints/consume-train"
  }
  infer {
    incoming   = "data/incoming-infer"
    output     = "output/predictions-stream.parquet"
    checkpoint = "output/checkpoints/consume-infer"
  }
}

name: infra-plan

on:
  pull_request:
    paths:
      - 'terraform/**'
      - 'envs/**'
      - '.github/workflows/infra-plan.yml'
      - '.github/workflows/infra-apply.yml'

permissions:
  contents: read
  pull-requests: write

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_REGION: eu-west-3
  TF_IN_AUTOMATION: 'true'

jobs:
  # Static checks first: fast feedback, no cloud access needed except init.
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init (remote state)
        run: terraform init -input=false

      - name: Validate
        run: terraform validate

      # IaC security scan (course chapter 5): misconfigurations caught
      # BEFORE any plan/apply.
      - name: Security scan (tfsec)
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: terraform

  # One plan per environment, posted on the PR: the reviewer reads WHAT will
  # change before it changes. The tfplan artifact is the CI→CD handover.
  plan:
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [dev, prod]
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Init
        run: terraform init -input=false

      - name: Select workspace
        run: terraform workspace select -or-create ${{ matrix.env }}

      - name: Plan
        run: |
          terraform plan -input=false -no-color \
            -var-file=../envs/${{ matrix.env }}.tfvars \
            -out=tfplan-${{ matrix.env }} | tee plan-${{ matrix.env }}.txt

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ matrix.env }}
          path: terraform/tfplan-${{ matrix.env }}

      - name: Comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let plan = fs.readFileSync('terraform/plan-${{ matrix.env }}.txt', 'utf8');
            if (plan.length > 60000) plan = plan.slice(0, 60000) + '\n... (truncated)';
            const body = '### Terraform plan — `${{ matrix.env }}`\n```\n' + plan + '\n```';
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

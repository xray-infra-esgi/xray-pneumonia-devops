name: app-ci

on:
  pull_request:
    paths:
      - 'app/**'
      - 'scripts/**'
      - 'fixtures/**'
      - '.github/workflows/app-ci.yml'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'scripts/**'
      - 'fixtures/**'
      - '.github/workflows/app-ci.yml'

permissions:
  contents: read
  packages: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The multi-stage Dockerfile compiles the Scala sources itself (sbt
      # assembly happens inside the build stage): CI orchestrates the build,
      # it never compiles by hand. First run takes ~10-15 min (sbt cold),
      # later runs benefit from layer caching.
      - name: Build application image
        run: docker build -t xray:ci app

      - name: Build dashboard image
        run: docker build -t xray-dashboard:ci app/app

      # End-to-end smoke test: the REAL streaming pipeline runs on committed
      # fixtures (8 X-ray images + trained SavedModel). If any link breaks:
      # stream read, vectorization, TensorFlow inference, parquet write,
      # nothing gets published.
      - name: Smoke test (real pipeline on fixtures)
        run: bash scripts/smoke_test.sh xray:ci

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Two tags per image: `latest` for the default pull, the commit SHA for
      # traceability and rollback (redeploy tag N-1 = one variable change).
      - name: Publish images (latest + commit SHA)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          OWNER="${{ github.repository_owner }}"
          for img in xray xray-dashboard; do
            docker tag "$img:ci" "ghcr.io/$OWNER/$img:latest"
            docker tag "$img:ci" "ghcr.io/$OWNER/$img:${{ github.sha }}"
            docker push "ghcr.io/$OWNER/$img:latest"
            docker push "ghcr.io/$OWNER/$img:${{ github.sha }}"
          done
